services:
  character-bot-postgres:
    image: "postgres:16"
    environment:
      TZ: "Asia/Tehran"
      POSTGRES_DB: "character_bot"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    stop_grace_period: 5m
    ports:
      - "5432:5432"
    stop_signal: SIGINT
    volumes:
      - "character-bot-postgres:/var/lib/postgresql/data"

  character-bot-langchain-postgres:
    image: "postgres:16"
    environment:
      TZ: "Asia/Tehran"
      POSTGRES_DB: "character_bot_langchain"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    stop_grace_period: 5m
    ports:
      - "5433:5432"
    stop_signal: SIGINT
    volumes:
      - "character-bot-langchain-postgres:/var/lib/postgresql/data"
  redis:
    image: "redis:7-alpine"
    ports:
      - "6379:6379"
    volumes:
      - "redis:/data"


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - character-bot-postgres
      - character-bot-langchain-postgres
volumes:
  character-bot-postgres:
  character-bot-langchain-postgres:
  redis:


